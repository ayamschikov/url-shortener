apiVersion: 1

# Авто-провижн источника данных: Grafana при старте сама подключит Prometheus,
# логиниться/настраивать руками не нужно. Фиксированный uid, чтобы дашборд мог
# на него ссылаться.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
